<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Febros16 - Frontend & Backend</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        #ujumbe { color: #007bff; font-weight: bold; font-size: 1.2em; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="box">
        <h1>Mfumo wa FEBROS16 Upo Hewani</h1>
        <p>Hii ni Frontend iliyopo Netlify.</p>
        
        <!-- Hapa ndipo majibu kutoka kwa Go yataonekana -->
        <p id="ujumbe">Inasubiri majibu kutoka kwa Server ya Go...</p>
        
        <button onclick="pigaHodiBackend()">Uliza Backend (Render)</button>
    </div>

    <script>
        // Hii ni JavaScript ya kuongea na ile link ya Render
        function pigaHodiBackend() {
            document.getElementById('ujumbe').innerText = "Inatafuta majibu...";
            
            // Hapa tunaweka ile link ya Render
            fetch('https://febros16-backend.onrender.com')
                .then(response => response.text()) // Tunachukua majibu kama maandishi
                .then(data => {
                    // Tunaweka majibu kwenye HTML
                    document.getElementById('ujumbe').innerText = "Backend Inasema: " + data;
                })
                .catch(error => {
                    document.getElementById('ujumbe').innerText = "Kuna tatizo kuunganisha na Backend.";
                    console.error('Kosa:', error);
                });
        }
    </script>

</body>
</html>
