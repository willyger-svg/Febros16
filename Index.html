<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Febros16 - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d1b2a;
            color: #4cc9f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            user-select: none;
        }
        .container {
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #48cae4;
            text-shadow: 0 0 15px rgba(72, 202, 228, 0.5);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        h1:active {
            transform: scale(0.98);
        }
        p {
            font-size: 1.2rem;
            color: #90e0ef;
            margin-top: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="brand">FEBROS16</h1>
        <p>Coming Soon</p>
    </div>

    <script>
        let tapCount = 0;
        let tapTimer;
        const brandText = document.getElementById('brand');

        brandText.addEventListener('click', () => {
            tapCount++;
            
            clearTimeout(tapTimer);

            if (tapCount === 2) {
                // Mtu akitap mara mbili inampeleka WhatsApp
                window.location.href = "https://wa.me/255750449373?text=Habari%20Febros16,%20nimetokea%20kwenye%20website!";
                tapCount = 0;
            } else {
                // Kama hakutap mara ya pili ndani ya sekunde 0.5, inareset
                tapTimer = setTimeout(() => {
                    tapCount = 0;
                }, 500);
            }
        });
    </script>

</body>
</html>
